[package]
name = "pathway-app"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Desktop shell for Rise Above"

# Not part of the main workspace: building it needs the platform webview toolchain.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pw-view = { path = "../../crates/pw-view" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
