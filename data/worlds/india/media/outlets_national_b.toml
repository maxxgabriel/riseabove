[meta]
dataset = "media.outlets_national_b"
quality = "C"
effective = "2026-07-01"
last_checked = "2026-09-30"
coverage = "44 additional real national-level general news and sports media outlets not in media/outlets.toml: English dailies and magazines, Hindi and Urdu dailies, news agencies, public radio, TV news channels with sports desks, TV/OTT sport platforms and digital sports portals. Metadata only; no journalists named."
gaps = [
  "All records are model knowledge (status inferred, q C; q D where unsure); no source URLs were consulted.",
  "Reach is given as a tier word (national/multi_state/state) plus an optional audience word only where defensible; no numeric circulation or viewership figures.",
  "Football-specific portals and podcasts beyond those already in outlets.toml (Goal India, Khel Now, Indian Football Network, Sportskeeda, The Bridge) could not be named with confidence and are not listed; no Indian football podcast is included.",
  "Optional extra field 'desc' (one-line coverage description) and 'note' (per-record caveat) are used here; neither is in SCHEMA.md.",
  "SCHEMA.md medium enum has no 'audio'/'podcast' value; OTT streaming platforms are recorded as kind digital_sports and TV news channels as kind general_news because no tv_news or ott kind exists.",
  "Ownership, launch years and channel branding change; entries with shaky flags carry a caveat in prov.note.",
  "Regional-language dailies, state-level outlets and Akashvani stations are in outlets_regional_b.toml; records duplicated there (for example Mid-Day, The Tribune, Hindustan, Sports Tak) were left out of this file.",
]

