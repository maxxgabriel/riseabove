[meta]
dataset = "media.outlets_specialist_b"
quality = "C"
effective = "2026-07-01"
last_checked = "2026-09-30"
coverage = "82 real specialist and digital football-related media entities in India and abroad: football-only sites and data platforms, federation and state-association channels, league and tournament channels, club-official channels, supporters' collectives, Akashvani and commercial FM, news agencies, sports weeklies and campus media. Metadata only; no journalists named; no numeric scores."
gaps = [
  "All records are model knowledge (status inferred with q C, or scenario_seed with q D where existence, activity or details are unsure); no source URLs were consulted (brief v2: no web access).",
  "Indian football podcasts and YouTube-only networks could not be named with confidence and are not listed; several regional football sites (Kerala, Bengal, Goa, north-east) are likewise omitted.",
  "No club TV channel is asserted; club-official records describe website and social/video channels only. Website addresses are given only where recalled with fair confidence.",
  "Optional extra fields used, not in SCHEMA.md: 'desc' (one-line coverage), 'club' (club id the outlet belongs to), 'association' (assoc id), 'base_country' (ISO alpha-3 for foreign-based outlets).",
  "SCHEMA.md outlet kind has no value for fan collectives, government bodies, data platforms or podcasts; supporters' groups are recorded as football_specialist, SAI as official_federation, PIB as news_agency and data platforms as digital_sports, each flagged in prov.note. SCHEMA GAP: add kinds fan_collective, government_body and data_platform, and medium value audio/podcast.",
  "SCHEMA.md reach enum (national|multi_state|state|local) cannot express foreign-based outlets; base_country is a workaround.",
  "media.aiff-tv, media.fsdl-media and the club/IWL records overlap partly with media.aiff-media and media.isl-official; separate ids kept because the brands differ.",
  "Founding years given only where well known; owners left out where unsure.",
  "Akashvani regional stations and regional-language dailies are in outlets_regional_b.toml and outlets.toml and not repeated here.",
]

