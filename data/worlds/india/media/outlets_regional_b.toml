[meta]
dataset = "media.outlets_regional_b"
quality = "C"
effective = "2026-07-01"
last_checked = "2026-09-30"
coverage = "226 regional-language, state and local outlets (dailies, news TV, radio, digital) additional to media/outlets.toml, across WB, Kerala, Karnataka, AP/Telangana, TN, Maharashtra, Goa, Manipur, Mizoram, Meghalaya, Assam and the North East, Sikkim, Punjab, J&K, Odisha, Gujarat and the Hindi belt, plus radio networks and Doordarshan regional channels."
gaps = [
  "All records are model knowledge (status inferred/unknown, q C/D); no source was opened. Existence, ownership, current print/broadcast status, reach and football emphasis are unverified.",
  "Records with status = unknown are outlets recalled with lower confidence; some may have closed, merged or rebranded.",
  "Owners are given only where recalled with reasonable confidence, and reflect the pre-2026 position; ownership changes are common (especially TV news).",
  "State sports weeklies and dedicated regional football magazines/blogs could not be recalled reliably and are not listed.",
  "Languages with no language id in languages.toml or no outlet reliably recalled are absent: Bodo, Garo (lang.grt exists) and Santali (lang.sat exists) outlets, Kokborok, Nishi, Konkani outside Goa, Tulu.",
  "Community radio, campus media, district-level weeklies, club-run channels and fan-run blogs/YouTube channels (official club media belongs in an official_club file) are not covered.",
  "Multi-edition dailies are recorded once at a home city; editions in other states are not enumerated.",
  "Some cross-border-edition or Kolkata/Delhi-based outlets have home_state chosen by headquarters, not readership."
]

