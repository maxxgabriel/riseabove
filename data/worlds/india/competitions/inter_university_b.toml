coverage = "AIU women's zone and All India football (plus the missing Central zone for men), the MAKA overall trophy, KIUG men and women splits, and about two dozen university inter-college football championships (Kerala, Bengal, Mumbai, Pune, Goa, Delhi, Punjab, North East, Karnataka, Tamil Nadu, Telangana, Odisha, Assam) plus one generic Vice-Chancellor's Cup template. Complements competitions/national.toml (men's AIU zones and All India, KIUG, SGFI)."
gaps = [
 "Model knowledge only, no web verification: names of university inter-college championships are descriptive (each university runs its own sports board events under its own names and dates); existence is highly likely but titles, formats, team counts and dates are not verified.",
 "Organiser field: no association records exist for university sports boards, so organiser is set to assoc.aiu (the umbrella body that these events feed) and the actual operator is in the operator text. SCHEMA GAP: an association kind for university sports boards (or organiser as free text) would be cleaner.",
 "AIU has five zones including Central; comp.aiu-central and comp.aiu-women-central are added here; the zone enum on [[university]] (north|south|east|west) does not include central. SCHEMA GAP: add central.",
 "No edition-level results, winners, hosts or years are recorded; nothing here is an achievement record.",
 "FISU World University Games football (India selection via AIU) is not modelled because the competition level enum has no global value. SCHEMA GAP: level = 'global'.",
 "Women's inter-college events are recorded only for Calicut, MG, Kerala and Kannur (Kerala has the deepest women's university football); other universities likely run them too.",
 "KIUG editions: 2020 Bhubaneswar, 2021 edition (April 2022) Bengaluru, 2022 edition (May 2023) Uttar Pradesh are recalled; later editions and football-specific participation not confirmed.",
]

