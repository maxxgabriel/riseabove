[meta]
dataset = "associations.state_b"
quality = "C"
effective = "2026-07-01"
season = "2026-27"
last_checked = "2026-09-30"
coverage = "Additions only: the state/UT associations missing from associations.toml (Andaman and Nicobar, Dadra and Nagar Haveli, Daman and Diu, Lakshadweep), the 14 Kerala district associations, and the main city/district bodies that operate headline leagues (Bengaluru, Mumbai, Pune, Nagpur, Chennai, Hyderabad, Shillong)."
gaps = [
  "All names, abbreviations, HQ cities and AIFF categories are model knowledge, not re-checked against AIFF or the associations; every record is C or D.",
  "Extra optional fields used, not in SCHEMA.md: `aliases` (list of text, already used by clubs/competitions), `aiff_category` (text: how the body sits in the AIFF structure, e.g. state association full member, institutional associate, district affiliate of a state association) and `competition_names` (list of text: headline competitions it runs, for competitions not yet defined as comp ids; `competitions` is used only for ids that exist).",
  "Existing associations.toml records carry no competitions and no aiff_category; not edited here (add-only assignment). Known naming issues there: assoc.fd (Football Delhi) was formerly the Delhi Soccer Association (DSA); assoc.wifa is the Western India Football Association whose district body is MDFA; assoc.fap 'Football Association of Punjab' vs the commonly used 'Punjab Football Association' is unresolved; assoc.mfa is Mizoram FA and assoc.mfa-ml is Meghalaya FA (abbreviation clash is why the -ml suffix exists).",
  "Whether the four UT bodies added here are current full AIFF members (and how the Dadra and Nagar Haveli and Daman and Diu merger of 2020 changed the two former associations) is not known; aiff_member is left out and status is unknown.",
  "Petroleum Sports Promotion Board or other institutional affiliates beyond SSCB and RSPB (already present) are not added: unsure whether AIFF currently affiliates them.",
  "Other district bodies exist across states (Bengal district sports associations, Goa taluka bodies, Coimbatore, Kolhapur, Guwahati, etc.) and are not covered.",
]

