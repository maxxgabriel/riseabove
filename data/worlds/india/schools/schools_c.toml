  "State sports hostels in Manipur, Mizoram, Meghalaya, Nagaland, Assam, Goa, Kerala, Jharkhand and Rajasthan are recorded as scheme-level entries whose exact site and football intake are unconfirmed.",
  "Networks (KVS, JNV, Odisha Adarsha Vidyalaya, Khelo India Centres, Kerala Sports Council hostels) are single records; individual member schools or centres are not itemised. SCHEMA GAP: a network/scheme kind, and a member-of link, would avoid this.",
  "SAI records: kind sai_centre is also used for NIS Patiala, LNIPE and LNCPE, which are higher-education or coaching institutions rather than training centres; SAI's individual football training centres are not itemised.",
  "Schools with football tradition are sampled from well-known names; a systematic census (for example SGFI football champions by year) was not possible without sources.",
  "Girls' schools and women's football school programmes are not covered.",
]

