# State league pyramids below the state top division (competition records only; no clubs/memberships here).
[meta]
dataset = "state_leagues.northeast_b"
quality = "D"
effective = "2026-07-01"
season = "2026-27"
last_checked = "2026-09-30"
coverage = "Eight northeastern states below their state top divisions: second divisions, women's leagues, cups and age-group championships (Mizoram, Manipur, Meghalaya, Assam, Nagaland, Arunachal Pradesh, Tripura, Sikkim)."
gaps = [
  "Model knowledge only (no web access, per brief v2): every record is q = C (existence and rough role believed correct) or q = D (name/format a scenario seed). No season-verified participant lists, team counts or dates.",
  "The state top-division competitions (state premier leagues) already exist in competitions/membership_t4_b.toml and are only REFERENCED here via qualifies_to; they were not edited, so their fed_by fields do not point back at the divisions defined here.",
  "tier is the in-state pyramid position (1 = state top division = game tier 4). District leagues and cups carry no tier.",
  "Women's leagues use qualifies_to = comp.iwl2 as a coarse pointer to the national women's pathway; the actual nomination mechanism for a given year was not checked.",
  "State Junior (u19) and Sub-Junior (u16) championships are pointed at comp.junior-nfc and comp.sub-junior-nfc; the exact age bands used by each state association in 2026-27 were not verified.",
  "Women's leagues for Kerala, Manipur, Odisha, Tamil Nadu, Delhi, Haryana, Karnataka, Goa, Mizoram, Meghalaya and Maharashtra (Mumbai) are defined by another agent in competitions/membership_women_b.toml and are deliberately not repeated here; women's leagues for the other states in this file are new (mostly q = D).",
  "Guwahati Premier League is already an alias of comp.as.assam-state-premier-league and is not a separate record.",
  "Locality-based club structures (Aizawl vengs, Imphal, Shillong localities) are recorded only as clubs elsewhere; no local ward/locality leagues are modelled.",
  "No lower-division records for Arunachal Pradesh and Tripura beyond a generic second division: names and formats could not be recalled.",
  "Assam's Bordoloi Trophy and the Guwahati Premier League are known names but their level, age band and current format are not verified.",
]

