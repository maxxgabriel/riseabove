[meta]
dataset = "national_teams.b"
quality = "C"
effective = "2026-07-01"
season = "2026-27"
last_checked = "2026-09-30"
coverage = "India national teams (senior, U23, U20/U19, U17, U15, futsal, beach soccer; men and women where they exist) and state/institutional representative teams for the Santosh Trophy, Senior Women's NFC, Junior and Sub-Junior National Championships (boys and girls). No player squads."
gaps = [
  "Written from model knowledge only (brief v2, no web access); nothing here is verified against an AIFF or AFC source.",
  "Participation of individual states in each age-group or women's championship varies by year; age-group and girls' state teams are scenario seeds (q=D) meaning 'the state can field one', not 'it fielded one in 2026-27'.",
  "Age bands of Junior (U19), Sub-Junior boys (U16) and girls (U17) championships have changed between seasons and are unverified.",
  "Extra optional fields used and NOT in SCHEMA.md: 'state' (state id the representative team is drawn from), 'nicknames' (list of text), 'discipline' (futsal or beach_soccer; absent means 11-a-side). Smallest schema addition: add these three optional fields to [[team]].",
  "No association records exist for Andaman and Nicobar Islands, Dadra and Nagar Haveli and Daman and Diu, or Lakshadweep, so their teams reference assoc.aiff as a placeholder and carry the 'state' field. SCHEMA GAP: add assoc records for those UT football bodies.",
  "Nicknames Blue Colts / Young Tigresses for youth sides are from memory of common media usage, not an official AIFF style guide.",
  "Futsal (women) and beach soccer teams are low-confidence: existence and competitions recalled, not checked.",
  "Services women and other institutional women sides (e.g. PSPB) not recorded; unsure they exist in the Senior Women's NFC.",
]

