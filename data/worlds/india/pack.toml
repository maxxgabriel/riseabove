# India football ecosystem: seed data.
#
# Names of real organisations are used as identities only. No history,
# result, title or record is attached to any of them: everything from the
# start date onward is simulated. Strengths below are *initial conditions*
# read once at world start (roughly how much football a state has around it);
# they move afterwards with investment, competition and what each place
# produces. Coordinates are a coarse 0-100 grid (west to east, south to
# north) used only for travel burden. Population is approximate, in millions.
#
# Replace or extend any of this from a real database export; the builder
# treats this file as the fallback, not the truth.

zones = ["North", "North-West", "East", "North-East", "West", "Central", "South", "South-West"]
languages = ["Hindi", "Bengali", "Malayalam", "Tamil", "Telugu", "Kannada", "Marathi", "Gujarati", "Punjabi", "Odia", "Assamese", "Manipuri", "Mizo", "Khasi", "Konkani", "Nepali", "Kashmiri", "Naga", "English"]

# strength: seed football participation 0-1; econ: household affordability 0-1;
# pro: closeness of professional clubs 0-1; lang: index into languages; zone: index into zones.
# Listed roughly by how much football there is, so a small world takes the first few.

