  "home_clubs is set only for a handful of ties I am fairly sure of; 2026-27 assignments are not confirmed.",
  "Kolkata Maidan club tents and practice grounds (many club-named grounds) are only sampled; a Maidan-wide census could not be produced from memory.",
  "Ground names in Manipur, Mizoram, Meghalaya and other district towns are recalled loosely; several may be named after people and are recorded under descriptive names.",
  "Surface and owner left out throughout.",
]

