# Frames for posts, written for the account's voice (`pw-narrate/src/lang.rs` builds the speaker from the account's kind and personality).
# A post is a report line (what happened, from the public facts) and a tail (the speaker's attitude, `tail:$behaviour`); an answer to someone else's post is its
# attitude alone (`social.reaction`). Tails state no fact: they take the certainty of the report line and never read as firmer than it. Behaviours:
# cheer, groan, praise, grumble, jibe, sarcasm, worry, ask, defend, concede, reluctant, hold, overrated (and the older reaction, hype, antihype ...).

# Social posts for events whose news headlines are the right size for a post. A post that relays a story, or that gives an opinion about one of these,
# states what the headline states, no more firmly than the speaker holds it (the certainty wrappers apply as they do in the press).

