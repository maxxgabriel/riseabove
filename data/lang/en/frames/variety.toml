# More ways to say the same true things (the highest-volume events). Nothing here adds a fact; each frame needs only what it names.

[[frame]]
id = "transfer.completed.news.headline.report.more.1"
event = "transfer.completed"
channel = "news"
slot = "headline"
topic = "report"
needs = ['to', 'player']
time = "past"
text = "{to} {lex:sign.past} {player}"

