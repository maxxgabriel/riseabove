# Frames for interviews: what someone said on the record, as far as the writer knows it (the stance, never the words).

[[frame]]
id = "interview.quote.news.headline.report.praise.1"
event = "interview.quote"
channel = "news"
slot = "headline"
topic = "report"
needs = ['speaker', 'about']
when = "stance == 'praise'"
time = "past"
text = "{speaker} hails {about}"

