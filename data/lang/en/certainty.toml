# --- Continuations: the same attribution already opened the text, so later details do not repeat it ------------------------------
[[wrapper]]
id = "cont.verified.1"
certainty = "verified_report"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "The same report adds that {clause}"
[[wrapper]]
id = "cont.verified.2"
certainty = "verified_report"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "It is also reported that {clause}"
[[wrapper]]
id = "cont.verified.3"
certainty = "verified_report"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "The report further says that {clause}"

[[wrapper]]
id = "cont.claim.1"
certainty = "source_claim"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "It is also claimed that {clause}"
[[wrapper]]
id = "cont.claim.2"
certainty = "source_claim"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "The same claim adds that {clause}"
[[wrapper]]
id = "cont.claim.3"
certainty = "source_claim"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "It is further claimed that {clause}"

[[wrapper]]
id = "cont.rumour.1"
certainty = "rumour"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "It is also said that {clause}"
[[wrapper]]
id = "cont.rumour.2"
certainty = "rumour"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "The talk also has it that {clause}"
[[wrapper]]
id = "cont.rumour.3"
certainty = "rumour"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "The chatter adds that {clause}"

[[wrapper]]
id = "cont.spec.1"
certainty = "speculation"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "It may also be that {clause}"
[[wrapper]]
id = "cont.spec.2"
certainty = "speculation"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "Perhaps too, {clause}"
[[wrapper]]
id = "cont.spec.3"
certainty = "speculation"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "A further guess is that {clause}"

[[wrapper]]
id = "cont.denial"
certainty = "denial"
continuation = true
slot = ["detail", "context", "situation", "summary", "line"]
text = "Also denied: {clause}"

# --- Subject lines are short: a prefix, never a long attribution -----------------------------------------------------------------
[[wrapper]]
id = "subj.verified"
certainty = "verified_report"
slot = ["subject"]
text = "Report: {clause}"
[[wrapper]]
id = "subj.claim"
certainty = "source_claim"
slot = ["subject"]
text = "Claim: {clause}"
[[wrapper]]
id = "subj.rumour"
certainty = "rumour"
slot = ["subject"]
text = "Rumour: {clause}"
[[wrapper]]
id = "subj.spec"
certainty = "speculation"
slot = ["subject"]
text = "Speculation: {clause}"
[[wrapper]]
id = "subj.denial"
certainty = "denial"
slot = ["subject"]
text = "Denied: {clause}"
[[wrapper]]
id = "subj.correction"
certainty = "correction"
slot = ["subject"]
text = "Correction: {clause}"
