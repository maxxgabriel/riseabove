# Certainty grammar. A `clause` frame states a proposition; the wrapper for the sentence's certainty turns it into what the speaker may honestly say.
# The certainty of a sentence is the weakest certainty of the facts it needs. Nothing is promoted. {cert:source} is only available if the speaker holds a
# source that may stand behind that certainty (see [[source]]); without one, wrappers that need it cannot be used.

# --- FACT -----------------------------------------------------------------------------------------------------------------
[[wrapper]]
id = "fact"
certainty = "fact"
text = "{clause}"

# --- VERIFIED REPORT ------------------------------------------------------------------------------------------------------
[[wrapper]]
id = "verified.said"
certainty = "verified_report"
slot = ["lede", "detail", "post", "situation", "line", "summary", "context"]
text = "{cert:source} {lex:report.past} that {clause}"
[[wrapper]]
id = "verified.according"
certainty = "verified_report"
slot = ["lede", "detail", "post", "situation", "line", "summary", "context"]
text = "{~According to|As reported by|Per} {cert:source}, {clause}"
[[wrapper]]
id = "verified.understood"
certainty = "verified_report"
slot = ["lede", "detail", "context"]
register = "formal"
text = "It is understood that {clause}, according to {cert:source}"
[[wrapper]]
id = "verified.headline"
certainty = "verified_report"
slot = ["headline", "heading", "bulletin"]
text = "{clause}, {lex:report.third} {cert:source}"

# --- SOURCE CLAIM ---------------------------------------------------------------------------------------------------------
[[wrapper]]
id = "claim.according"
certainty = "source_claim"
slot = ["lede", "detail", "post", "situation", "line", "summary", "context"]
text = "{~According to|Per} {cert:source}, {clause}"
[[wrapper]]
id = "claim.claimed"
certainty = "source_claim"
slot = ["lede", "detail", "post", "situation", "line", "summary", "context"]
text = "{cert:source} {lex:claim.past} that {clause}"
[[wrapper]]
id = "claim.headline"
certainty = "source_claim"
slot = ["headline", "heading", "bulletin"]
text = "{clause}, {lex:claim.third} {cert:source}"

# --- RUMOUR ---------------------------------------------------------------------------------------------------------------
[[wrapper]]
id = "rumour.talk"
certainty = "rumour"
slot = ["lede", "detail", "post", "situation", "line", "summary", "context"]
text = "{~There is talk that|The word is that|Whispers suggest that} {clause}"
[[wrapper]]
id = "rumour.heard"
certainty = "rumour"
slot = ["lede", "detail", "post", "situation", "line", "summary", "context"]
text = "{cert:source} {lex:hear.agr} that {clause}"
[[wrapper]]
id = "rumour.headline"
certainty = "rumour"
slot = ["headline", "heading", "bulletin"]
text = "Rumour: {clause}"

# --- SPECULATION ----------------------------------------------------------------------------------------------------------
[[wrapper]]
id = "spec.maybe"
certainty = "speculation"
slot = ["lede", "detail", "post", "situation", "line", "summary", "context", "verdict"]
text = "{~It may be that|Perhaps|One reading is that} {clause}"
[[wrapper]]
id = "spec.headline"
certainty = "speculation"
slot = ["headline", "heading", "bulletin"]
text = "Speculation: {clause}"

# --- DENIAL ---------------------------------------------------------------------------------------------------------------
[[wrapper]]
id = "denial.denied"
certainty = "denial"
slot = ["lede", "detail", "post", "situation", "line", "summary", "context"]
text = "{cert:source} {lex:deny.past} that {clause}"
[[wrapper]]
id = "denial.dismissed"
certainty = "denial"
slot = ["lede", "detail", "post", "situation", "line", "summary", "context"]
text = "{cert:source} {lex:dismiss_claim.past} the claim that {clause}"
[[wrapper]]
id = "denial.headline"
certainty = "denial"
slot = ["headline", "heading", "bulletin"]
text = "{cert:source} {lex:deny.agr}: {clause}"

# --- CORRECTION -----------------------------------------------------------------------------------------------------------
[[wrapper]]
id = "correction.body"
certainty = "correction"
slot = ["lede", "post", "situation", "line", "summary"]
text = "Correction: {clause}, not as first reported"
[[wrapper]]
id = "correction.detail"
certainty = "correction"
slot = ["detail", "context"]
text = "Also corrected: {clause}"
[[wrapper]]
id = "correction.headline"
certainty = "correction"
slot = ["headline", "heading", "bulletin"]
text = "Correction: {clause}"

# --- UNKNOWN (used by clause frames that explicitly list `unknown`) -----------------------------------------------------------
[[wrapper]]
id = "unknown.unclear"
certainty = "unknown"
text = "It is not yet clear whether {clause}"

