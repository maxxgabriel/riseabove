# Event semantics: what facts an event has. `hidden = true` marks true facts that outsiders do not know (they may only appear for a speaker whose
# knowledge lists them, and the leak check watches for them). Types: club person team competition place text num money date list bool.
# Derived facts (match.result: total margin result_kind winner loser winner_goals loser_goals) are computed from these by the engine.

[[event]]
kind = "transfer.bid_made"
