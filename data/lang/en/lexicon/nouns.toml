# Football lexicon: concepts with variants. A variant gives word forms, register and (optionally) the conditions under which the word is honest.
# forms: verbs base/third/past/pp/ing, nouns sing/plur. `when`/`requires` restrict a variant to what the known facts support.

[[concept]]
id = "bid"
meaning = "a formal offer for a player"
pos = "noun"
[[concept.variant]]
forms = { sing = "bid", plur = "bids" }
register = "neutral"
[[concept.variant]]
forms = { sing = "offer", plur = "offers" }
register = "neutral"
[[concept.variant]]
forms = { sing = "approach", plur = "approaches" }
register = "neutral"
when = "!fee"
note = "an approach is an enquiry, not a fee offer; use only when no fee is given"

[[concept]]
id = "injury"
meaning = "a player's physical problem"
pos = "noun"
[[concept.variant]]
forms = { sing = "injury", plur = "injuries" }
register = "neutral"
[[concept.variant]]
forms = { sing = "knock", plur = "knocks" }
register = "informal"
when = "weeks_out <= 3"
note = "minor: use only when weeks_out is small"
[[concept.variant]]
forms = { sing = "setback", plur = "setbacks" }
register = "neutral"
[[concept.variant]]
forms = { sing = "blow", plur = "blows" }
register = "tabloid"
[[concept.variant]]
forms = { sing = "problem", plur = "problems" }
register = "informal"

[[concept]]
