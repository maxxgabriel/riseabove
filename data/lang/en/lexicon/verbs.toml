# Football lexicon: concepts with variants. A variant gives word forms, register and (optionally) the conditions under which the word is honest.
# forms: verbs base/third/past/pp/ing, nouns sing/plur. `when`/`requires` restrict a variant to what the known facts support.

[[concept]]
id = "report"
meaning = "a source tells the public something"
pos = "verb"
[[concept.variant]]
forms = { base = "report", third = "reports", past = "reported", pp = "reported", ing = "reporting" }
register = "neutral"
[[concept.variant]]
forms = { base = "say", third = "says", past = "said", pp = "said", ing = "saying" }
register = "informal"
[[concept.variant]]
forms = { base = "state", third = "states", past = "stated", pp = "stated", ing = "stating" }
register = "formal"

