# Attitude words for posts: what a supporter says about something that has happened, as opposed to what happened. They carry no facts, so they are
# honest about anything; a variant that rests on one (`requires`/`when`) says so. Chosen for the speaker's voice, which for an account is built from its
# personality (`humour`, `optimism`, `skepticism`, `emotion`, `slang`, `formality`): a joker, a pessimist and a formal analyst do not pick the same word.
# Variants with no voice are the plain baseline, used when no more specific word suits the speaker.

