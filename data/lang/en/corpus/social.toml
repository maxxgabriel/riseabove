# Posts: a report line and the speaker's attitude, or an attitude alone in answer to another post. Facts the account does not hold never appear, and an attitude
# is never firmer than the report line it follows.

[[case]]
id = "social.late_winner.cheer"
summary = "A supporter celebrates a late winner."
now = "2026-05-02"
channel = "social"
behaviour = "cheer"
seeds = 12
[case.event]
kind = "match.moment"
date = "2026-05-02"
[case.event.facts]
kind = "late_winner"
player = { id = "person.rahul-kumar", full = "Rahul Kumar", short = "Rahul", plural = false, descriptors = [{ kind = "age_role", text = "19-year-old winger" }, { kind = "role", text = "winger" }] }
club = { id = "club.kerala-blasters", full = "Kerala Blasters", short = "Blasters", plural = true }
opponent = { id = "club.mohun-bagan-sg", full = "Mohun Bagan SG", short = "Mohun Bagan", plural = true }
[case.speaker]
role = "fan"
voice = "fan_hype"
witness = true
[case.expect]
must_contain = ["Rahul"]
certainty = "fact"
min_distinct = 3

