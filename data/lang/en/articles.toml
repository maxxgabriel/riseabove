# Article structures: which slot:topic items make up a text, in order, per event and channel. An item with no frame that the speaker can honestly
# write is skipped; `required` items make the rendering report itself incomplete. `tail:$behaviour` takes the request's behaviour (omitted when none).

[[article]]
event = "transfer.bid_rejected"
channel = "news"
structure = ["headline:report", "lede:report", "detail:fee", "detail:round", "detail:minimum", "context:background"]
required = ["headline:report", "lede:report"]

[[article]]
event = "transfer.bid_rejected"
channel = "inbox"
structure = ["subject:report", "opening:greet", "situation:report", "situation:minimum", "ask:choice", "closing:sign"]
required = ["subject:report", "situation:report"]

