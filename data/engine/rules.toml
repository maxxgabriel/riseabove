# Nations in a free-movement bloc (their players are not foreign to each other
# for registration and work permits).
[[bloc]]
key = "EU"
nations = ["AUT", "BEL", "BUL", "CRO", "CYP", "CZE", "DEN", "EST", "FIN", "FRA", "GER", "GRE", "HUN", "IRL", "ITA", "LVA", "LTU", "LUX", "MLT", "NED", "POL", "POR", "ROU", "SVK", "SVN", "ESP", "SWE", "NOR", "ISL", "SUI", "LIE"]
