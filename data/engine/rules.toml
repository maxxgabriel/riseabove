# Football rules as data (02 §3). Every nation uses one profile; profiles can
# be assigned per confederation and overridden per nation code. Deals, squad
# registrations and team selection are checked against these, and a deal can
# fail because of them.

[[profile]]
key = "default"
bloc = ""
squad_max = 25
homegrown_min = 0
homegrown_age_from = 15
homegrown_age_to = 21
homegrown_years = 3
u21_exempt_age = 21
foreign_squad_max = 0          # 0 = unlimited
foreign_on_pitch_max = 0       # 0 = unlimited
min_pro_age = 16
max_contract_years = 5
max_contract_years_minor = 3
minor_age = 18
minors_abroad_min_age = 18
bloc_minors_min_age = 16
work_permit = false
work_permit_min_points = 15
max_loans_in = 6
max_loans_out = 0              # 0 = unlimited
loans_domestic_only = false
red_ban_straight = 3
red_ban_second_yellow = 1
cup_tied = true
registrations_per_season = 3
play_for_clubs_per_season = 2
max_foreign_age_youth = 0      # 0 = no extra restriction

